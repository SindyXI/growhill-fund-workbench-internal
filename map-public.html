const loginAudience='internal';
function setLoginLang(lang){if(!loginStrings[lang])return;try{localStorage.setItem('growhill-workbench-language-v1',lang)}catch(_){}const t=loginStrings[lang];document.documentElement.lang=({sc:'zh-CN',tc:'zh-HK',en:'en'})[lang];document.querySelector('main h1').textContent=t.title;document.querySelector('label[for=code]').textContent=t.label;document.getElementById('submit').textContent=t.submit;document.getElementById('loginDescription').textContent=t[loginAudience+'Description'];document.getElementById('loginCaution').textContent=t[loginAudience+'Caution'];document.querySelectorAll('#loginLang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)))}
document.querySelectorAll('#loginLang button').forEach(b=>b.addEventListener('click',()=>setLoginLang(b.dataset.lang)));
try{setLoginLang(localStorage.getItem('growhill-workbench-language-v1')||'sc')}catch(_){setLoginLang('sc')}
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
  if(!('DecompressionStream' in globalThis))throw Error('browser');
  const stream=new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();document.open();document.write(html);document.close();
}
const storageKey='workbench_code_'+location.pathname.split('/').filter(Boolean)[0];
const saved=sessionStorage.getItem(storageKey);
const isHome=location.pathname.endsWith('/index.html')||location.pathname.endsWith('/');
if(saved){unlock(saved).catch(()=>{sessionStorage.removeItem(storageKey);if(!isHome)location.replace('index.html');});}
else if(!isHome){location.replace('index.html');}
document.getElementById('unlock').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error'),code=document.getElementById('code').value.trim();button.disabled=true;error.textContent='正在打开…';try{sessionStorage.setItem(storageKey,code);await unlock(code);}catch(e){sessionStorage.removeItem(storageKey);error.textContent=e.message==='browser'?'请使用新版浏览器打开工作台。':'访问码不正确，请重新输入。';button.disabled=false;}});
